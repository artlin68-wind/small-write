name: 更新集保千張大戶資料

on:
  schedule:
    # 每週六 01:00 UTC（台灣時間 09:00）；TDCC 於週五收盤後更新
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "要補歷史的股票代號（空白分隔，例如 2379 2330），留空則只抓最新一週"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tdcc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓最新一週（全市場）
        run: python scripts/fetch_tdcc.py weekly

      - name: 補歷史資料
        if: ${{ github.event.inputs.backfill != '' }}
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: python scripts/fetch_tdcc.py backfill $BACKFILL

      - name: Commit 資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/tdcc
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "Update TDCC shareholding data"
            git push
          fi
